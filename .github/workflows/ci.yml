name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Public CLI smoke
        run: uv run pi-agent --provider fake --prompt "inspect this workspace"

      - name: Tool evaluation smoke
        run: uv run pi-agent eval --suite tools --provider fake

  web:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Frontend dependencies
        working-directory: web-ui
        run: npm ci --no-fund --no-audit
      - name: Frontend unit tests
        working-directory: web-ui
        run: npm run test
      - name: Real launcher smoke
        run: uv run python scripts/web_startup_smoke.py
      - name: Install Chromium
        working-directory: web-ui
        run: npx playwright install chromium
      - name: Browser tests
        working-directory: web-ui
        run: npm run test:e2e
