[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-langgraph"
version = "0.1.0"
description = "A teaching-focused Python reconstruction of Pi Agent using LangGraph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
scripts = { pi-agent = "pi_agent.cli.app:main", pi-agent-server = "pi_agent.server.app:main", pi-agent-client = "pi_agent.client.app:main", pi-agent-web = "pi_agent.web.app:main" }
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core>=1.2,<2",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.135,<1",
    "filelock>=3.18,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]

[tool.hatch.build]
artifacts = ["src/pi_agent/web/static/**"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
markers = [
    "live: requires explicit provider configuration and may access the configured endpoint",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
extend-exclude = [".pytest-tmp", ".pytest-tmp-*"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["pi_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
