[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-langgraph"
version = "0.1.0"
description = "A teaching-focused Python reconstruction of Pi Agent using LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.14"
scripts = { pi-agent = "pi_agent.cli.app:main" }
dependencies = [
    "langchain-core>=1.2,<2",
    "langgraph>=1.2,<1.3",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["pi_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
